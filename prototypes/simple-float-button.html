<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>悬浮窗 · 站点余额 — XiaoBaiSwitch Plus 原型 v4（对齐真实实现）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /*
    取值来源：src/App.tsx 主题配置（antd 亮色算法 + primaryColor #1677ff）
    + ~/.xiaobai-switch 里的设置（themeMode=system / primaryColor=#1677ff）
    状态色与阈值来源：src/pages/FloatingWindow.tsx
      quotaColor()  → 无限=success / 余额<5=warning / 余额>0=primary / 其他=tertiary
      LOW_BALANCE_USD = 5（绝对金额，非百分比）
      formatQuota() → $x.xx / 无限 / 不可用
  */
  :root {
    --canvas:      #F2F5F9;
    --panel:       rgba(255, 255, 255, .94);
    --line:        #F0F0F0;   /* antd colorBorderSecondary */
    --line-strong: #E3E6EC;
    --text:        rgba(0, 0, 0, .88);
    --text-2:      rgba(0, 0, 0, .65);
    --text-3:      rgba(0, 0, 0, .45);   /* colorTextTertiary */
    --primary:     #1677FF;              /* colorPrimary */
    --success:     #52C41A;              /* colorSuccess */
    --warning:     #FAAD14;              /* colorWarning */
    --ease:        cubic-bezier(0.4, 0, 0.2, 1);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(160deg, #F7F9FC 0%, #E9EEF5 100%);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .demo-note {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 7px; pointer-events: none; user-select: none;
  }
  .demo-note h1 { font-size: 14px; font-weight: 600; color: #9AA4B2; }
  .demo-note p  { font-size: 12px; color: #B4BCC8; }

  /* ── 收起态：圆球（真实实现） ─────────────────────
     颜色规则：有任一站点余额偏低 → warning；否则 → primary。
     没有数字角标。 */
  .orb {
    position: fixed; right: 32px; bottom: 32px;
    width: 56px; height: 56px;          /* = tauri.conf.json minWidth/minHeight */
    border: 1px solid rgba(0, 0, 0, .06);
    border-radius: 50%;
    background: var(--warning);           /* 数据里有 1 个低余额站点 */
    cursor: pointer;
    display: grid; place-items: center;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .22);
    transition: transform .18s var(--ease), box-shadow .18s var(--ease);
    z-index: 30;
  }
  .orb:hover  { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0, 0, 0, .26); }
  .orb:active { transform: scale(.94); }
  .orb svg { width: 22px; height: 22px; color: #fff; }
  /* 真实实现是「要么圆球、要么面板」，展开时圆球不显示 */
  .orb.open { display: none; }

  /* ── 展开态：面板（真实实现） ─────────────────────── */
  .panel {
    position: fixed; right: 32px; bottom: 32px;
    width: 280px;                        /* = tauri.conf.json width */
    background: var(--panel);
    border: 1px solid var(--line-strong);
    border-radius: 14px;
    box-shadow: 0 12px 32px rgba(15, 23, 42, .14), 0 2px 8px rgba(15, 23, 42, .06);
    overflow: hidden;
    display: flex; flex-direction: column;
    transform-origin: bottom right;
    opacity: 0; transform: translateY(8px) scale(.96);
    pointer-events: none;
    transition: opacity .2s var(--ease), transform .22s var(--ease);
    z-index: 20;
  }
  .panel.show { opacity: 1; transform: none; pointer-events: auto; }

  /* 头部：真实实现里整条可拖动、点击收起 */
  .head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    cursor: move;
  }
  .head-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .head-left > svg.dollar { width: 16px; height: 16px; color: var(--primary); flex: none; }
  .head-title { font-size: 13px; font-weight: 600; }
  .head-warn { width: 13px; height: 13px; color: var(--warning); flex: none; }

  .head-actions { display: flex; align-items: center; gap: 2px; flex: none; }
  .icon-btn {
    width: 26px; height: 26px;
    display: grid; place-items: center;
    border: none; border-radius: 6px; background: transparent;
    color: var(--text-3); cursor: pointer;
    transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: rgba(0, 0, 0, .045); color: var(--text-2); }
  .icon-btn.spin svg { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 列表：行不可点击（真实实现没有 onClick） */
  .list { padding: 8px 12px; }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
    padding: 7px 10px;
    border-radius: 8px;
    background: rgba(0, 0, 0, .022);
    border: 1px solid rgba(0, 0, 0, .04);
    margin-bottom: 6px;
  }
  .row:last-child { margin-bottom: 0; }

  /* 禁用站点：整行淡化（真实实现 opacity .45） */
  .row.disabled { opacity: .45; }

  .name {
    font-size: 13px; color: var(--text);
    max-width: 150px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .val-wrap { display: flex; align-items: center; gap: 4px; flex: none; }
  .val { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .val-primary { color: var(--primary); }
  .val-success { color: var(--success); }
  .val-warning { color: var(--warning); }
  .val-tertiary { color: var(--text-3); font-weight: 400; }
  .row-warn { width: 12px; height: 12px; color: var(--warning); flex: none; }

  /* 底部：最后更新时间（真实实现） */
  .foot {
    padding: 8px 12px;
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 11px; color: var(--text-3);
  }
</style>
</head>
<body>

<div class="demo-note">
  <h1>右下角圆球 → 展开站点余额</h1>
  <p>忠实还原真实实现：行不可点击 · 低余额按「绝对金额 &lt; $5」判定 · 无总余额</p>
</div>

<!-- 收起态圆球：有低余额站点时是琥珀色，否则是主色蓝 -->
<button class="orb open" id="orb" aria-label="展开站点余额">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M12 2v20M17 6.5c0-1.9-2.2-3-5-3s-5 1.1-5 3 2.2 2.8 5 3.3 5 1.4 5 3.4-2.2 3.3-5 3.3-5-1.3-5-3.2"/>
  </svg>
</button>

<!-- 展开态面板 -->
<div class="panel show" id="panel" role="dialog" aria-label="站点余额">
  <div class="head" id="head">
    <div class="head-left">
      <svg class="dollar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 2v20M17 6.5c0-1.9-2.2-3-5-3s-5 1.1-5 3 2.2 2.8 5 3.3 5 1.4 5 3.4-2.2 3.3-5 3.3-5-1.3-5-3.2"/>
      </svg>
      <span class="head-title">站点余额</span>
      <!-- 有低余额站点时出现（真实实现） -->
      <svg class="head-warn" viewBox="0 0 24 24" fill="currentColor" aria-label="余额偏低">
        <path d="M12 2 1 21h22L12 2zm1 14h-2v2h2v-2zm0-7h-2v5h2V9z"/>
      </svg>
    </div>
    <div class="head-actions">
      <button class="icon-btn" id="refresh" aria-label="刷新">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
        </svg>
      </button>
      <button class="icon-btn" id="collapse" aria-label="收起">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6 15l6-6 6 6"/>
        </svg>
      </button>
      <button class="icon-btn" id="close" aria-label="关闭">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="list">
    <!-- 余额正常 → primary 蓝 -->
    <div class="row">
      <span class="name">OpenRouter</span>
      <span class="val-wrap"><span class="val val-primary">$24.56</span></span>
    </div>

    <!-- 余额 < $5 → warning 琥珀 + 警告图标 -->
    <div class="row">
      <span class="name">Anthropic 官方</span>
      <span class="val-wrap">
        <svg class="row-warn" viewBox="0 0 24 24" fill="currentColor" aria-label="余额偏低">
          <path d="M12 2 1 21h22L12 2zm1 14h-2v2h2v-2zm0-7h-2v5h2V9z"/>
        </svg>
        <span class="val val-warning">$2.41</span>
      </span>
    </div>

    <!-- 无限额度 → success 绿 -->
    <div class="row">
      <span class="name">Groq</span>
      <span class="val-wrap"><span class="val val-success">无限</span></span>
    </div>

    <!-- 无额度信息 → tertiary 灰 -->
    <div class="row">
      <span class="name">Google AI Studio</span>
      <span class="val-wrap"><span class="val val-tertiary">不可用</span></span>
    </div>

    <!-- 站点已禁用 → 整行淡化 -->
    <div class="row disabled">
      <span class="name">智谱 GLM</span>
      <span class="val-wrap"><span class="val val-primary">$18.20</span></span>
    </div>
  </div>

  <div class="foot">最后更新 <span id="updated">15:57:12</span></div>
</div>

<script>
  const orb      = document.getElementById('orb');
  const panel    = document.getElementById('panel');
  const head     = document.getElementById('head');
  const refresh  = document.getElementById('refresh');
  const collapse = document.getElementById('collapse');
  const close    = document.getElementById('close');
  const updated  = document.getElementById('updated');

  function setOpen(open) {
    // 真实实现：收起态是圆球、展开态是面板，二者互斥
    panel.classList.toggle('show', open);
    orb.classList.toggle('open', open);
    orb.setAttribute('aria-label', open ? '收起站点余额' : '展开站点余额');
  }

  orb.addEventListener('click', () => setOpen(!panel.classList.contains('show')));

  // 真实实现：点击头部整条 = 收起
  head.addEventListener('click', (e) => {
    if (e.target.closest('.icon-btn')) return;
    setOpen(false);
  });

  // 真实实现的收起按钮
  collapse.addEventListener('click', (e) => { e.stopPropagation(); setOpen(false); });

  refresh.addEventListener('click', (e) => {
    e.stopPropagation();
    refresh.classList.add('spin');
    setTimeout(() => {
      refresh.classList.remove('spin');
      const now = new Date();
      const p = (n) => String(n).padStart(2, '0');
      updated.textContent = `${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`;
    }, 800);
  });

  close.addEventListener('click', (e) => {
    e.stopPropagation();
    setOpen(false);
  });

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setOpen(false); });
</script>
</body>
</html>
