[package]
name = "xiaobai-switch-plus"
version = "0.1.6"
description = "Site-driven Claude Code, Codex & Pi config switcher (fork of Licoy's XiaoBaiSwitch)"
authors = ["Licoy"]
license = "MIT"
edition = "2021"
default-run = "XiaoBaiSwitchPlus"

[lib]
name = "xiaobai_switch_plus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "XiaoBaiSwitchPlus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream"] }
url = "2"
toml_edit = "0.22"
tempfile = "3"
fs2 = "0.4"
hex = "0.4"
parking_lot = "0.12"
once_cell = "1"
jsonc-parser = { version = "0.33", features = ["cst", "serde_json"] }
quick-xml = "0.38"
zip = { version = "4", default-features = false, features = ["deflate"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
anyhow = "1"
semver = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[dev-dependencies]
tempfile = "3"
